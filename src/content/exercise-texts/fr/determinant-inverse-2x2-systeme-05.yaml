title: Résoudre un système par la matrice inverse
statement: |
  Soit $A = \begin{pmatrix} 3 & 1 \ 1 & 2 \end{pmatrix}$. Résous $A \begin{pmatrix} x \ y \end{pmatrix} = \begin{pmatrix} 7 \ 3 \end{pmatrix}$ en utilisant $A^{-1}$.
  Donne la valeur de $x$.
hints:
  - 'Calcule $\det A = 3 \times 2 - 1 \times 1 = 5$, puis $A^{-1} = \frac{1}{5}\begin{pmatrix} 2 & -1 \ -1 & 3 \end{pmatrix}$.'
  - 'Multiplie $A^{-1}$ par $\begin{pmatrix} 7 \ 3 \end{pmatrix}$ : le premier coefficient donne $x$.'
solution: |
  $\det A = 5 \neq 0$, donc $A^{-1} = \frac{1}{5}\begin{pmatrix} 2 & -1 \ -1 & 3 \end{pmatrix}$.

  $\begin{pmatrix} x \ y \end{pmatrix} = A^{-1}\begin{pmatrix} 7 \ 3 \end{pmatrix} = \frac{1}{5}\begin{pmatrix} 2\times 7 - 1\times 3 \ -1\times 7 + 3\times 3 \end{pmatrix} = \frac{1}{5}\begin{pmatrix} 11 \ 2 \end{pmatrix}$.

  Donc $x = \frac{11}{5} = 2{,}2$ et $y = \frac{2}{5} = 0{,}4$.

  Pièges : oublier de diviser par le déterminant donne $x = 11$ ; garder les signes de $A$ dans l'adjugée donne un résultat faux. Vérification : $3 \times 2{,}2 + 0{,}4 = 7$ et $2{,}2 + 2 \times 0{,}4 = 3$.
