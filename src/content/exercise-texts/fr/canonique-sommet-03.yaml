title: Minimum d'un trinôme
statement: |
  Quel est le minimum de la fonction $f(x) = x^{2} + 2x - 3$ ?
hints:
  - 'Calcule d''abord l''abscisse du sommet $\alpha = -\dfrac{b}{2a}$.'
  - 'Le minimum est $f(\alpha)$.'
solution: |
  $\alpha = -\dfrac{2}{2 \times 1} = -1$.

  $f(-1) = (-1)^{2} + 2 \times (-1) - 3 = 1 - 2 - 3 = -4$.

  Comme $a = 1 > 0$, la parabole est tournée vers le haut : le minimum vaut $-4$.