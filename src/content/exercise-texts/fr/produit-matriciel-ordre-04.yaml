title: L'ordre des matrices compte
statement: |
  Soient $A = \begin{pmatrix} 1 & 2 \ 3 & 4 \end{pmatrix}$ et $B = \begin{pmatrix} 2 & 0 \ 1 & 2 \end{pmatrix}$.
  Quel est le coefficient en ligne 2, colonne 1 de $BA$ ?
choices:
  a: '$7$'
  b: '$10$'
  c: '$6$'
  d: '$2$'
hints:
  - 'Pour $BA$, prends la ligne 2 de $B$ et la colonne 1 de $A$. Ne confonds pas avec $AB$.'
solution: |
  Ligne 2 de $B$ : $(1 \ ;\ 2)$. Colonne 1 de $A$ : $\begin{pmatrix} 1 \ 3 \end{pmatrix}$.

  $(BA)_{21} = 1 \times 1 + 2 \times 3 = 1 + 6 = 7$.

  (Pour comparaison, $(AB)_{21} = 3 \times 2 + 4 \times 1 = 10$ : bien différent, donc $BA \neq AB$.)

  Pièges : b est le coefficient de $AB$ à la même place (ordre des matrices inversé) ; c est $3 \times 2$ (multiplication terme à terme, c'est le produit de Hadamard, pas le produit matriciel) ; d prend la ligne 1 de $B$ au lieu de la ligne 2 (mauvaise ligne).
