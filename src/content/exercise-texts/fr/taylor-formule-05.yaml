title: Développement de l'exponentielle
statement: |
  Quel est le développement de $e^{x}$ à l'ordre 2 autour de 0 ?
choices:
  a: '$1 + x + \dfrac{x^{2}}{2}$'
  b: '$1 + x + x^{2}$'
  c: '$1 + \dfrac{x}{2} + \dfrac{x^{2}}{2}$'
  d: '$x + \dfrac{x^{2}}{2}$'
hints:
  - 'Chaque terme est $f^{(k)}(0)/k!$ fois $x^{k}$.'
solution: |
  Pour $e^{x}$, toutes les dérivées valent 1 en 0, donc le terme d'ordre $k$ est $x^{k}/k!$ : la réponse **a** est correcte.

  - La réponse b oublie de diviser par $k!$ (ici par 2).
  - La réponse c met $x/2$ au lieu de $x$ au premier ordre.
  - La réponse d oublie le terme constant 1.