title: Développer (x − 2)³
statement: |
  Quel est le développement de $(x - 2)^{3}$ ?
choices:
  a: '$x^{3} - 6x^{2} + 12x - 8$'
  b: '$x^{3} - 8$'
  c: '$x^{3} - 6x^{2} + 12x + 8$'
  d: '$x^{3} - 3x^{2} + 3x - 8$'
hints:
  - 'Applique $(a + b)^{n}$ avec $a = x$, $b = -2$ et $n = 3$ ; les coefficients sont $1,\ 3,\ 3,\ 1$.'
solution: |
  $(x - 2)^{3} = x^{3} + 3x^{2}(-2) + 3x(-2)^{2} + (-2)^{3} = x^{3} - 6x^{2} + 12x - 8$.

  La réponse b oublie tous les termes croisés ; la réponse c oublie que $(-2)^{3} = -8$ ; la réponse d n'élève pas $-2$ aux bonnes puissances.