title: Développer (x + 1)³
statement: |
  Quel est le développement de $(x + 1)^{3}$ ?
choices:
  a: '$x^{3} + 3x^{2} + 3x + 1$'
  b: '$x^{3} + 1$'
  c: '$x^{3} + 2x^{2} + 2x + 1$'
  d: '$x^{3} + 3x + 3$'
hints:
  - 'Les coefficients de la ligne $n = 3$ du triangle de Pascal sont $1,\ 3,\ 3,\ 1$.'
solution: |
  $(x + 1)^{3} = \dbinom{3}{0}x^{3} + \dbinom{3}{1}x^{2} + \dbinom{3}{2}x + \dbinom{3}{3} = x^{3} + 3x^{2} + 3x + 1$.

  La réponse b oublie tous les termes croisés.
