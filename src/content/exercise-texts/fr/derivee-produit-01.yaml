title: Dérivée d'un produit au point
statement: |
  Soit $f(x) = (2x + 1)(x^{2} - 3)$.
  Calcule $f'(1)$.
hints:
  - 'Sois $u = 2x + 1$ et $v = x^{2} - 3$, puis applique $(uv)^{\\prime} = u^{\\prime}v + uv^{\\prime}$.'
  - 'Calcule $u^{\\prime}$ et $v^{\\prime}$ séparément, puis remplace $x$ par $1$.'
solution: |
  $u = 2x + 1$ donc $u' = 2$.
  $v = x^{2} - 3$ donc $v' = 2x$.
  $(uv)' = u'v + uv' = 2(x^{2} - 3) + (2x + 1) \\times 2x$.
  À $x = 1$ : $u(1) = 3$, $v(1) = -2$, $u'(1) = 2$, $v'(1) = 2$.
  $f'(1) = 2 \\times (-2) + 3 \\times 2 = -4 + 6 = 2$.
