title: La bonne distance
statement: |
  Dans un repère orthonormé, on donne A(1 ; -2) et B(4 ; 2).
  Combien vaut AB ?
choices:
  a: '$5$'
  b: '$7$'
  c: '$25$'
  d: '$3$'
hints:
  - 'Calcule les écarts : xB - xA et yB - yA.'
  - 'N''oublie pas la racine carrée à la fin.'
solution: |
  $x_{B} - x_{A} = 4 - 1 = 3$ et $y_{B} - y_{A} = 2 - (-2) = 4$.

  $AB = \\sqrt{3^{2} + 4^{2}} = \\sqrt{9 + 16} = \\sqrt{25} = 5$.

  La réponse b additionne les écarts (3 + 4 = 7). La réponse c oublie la racine carrée (3² + 4² = 25). La réponse d ne garde que l'écart d'abscisses.
