title: Probabilité de l'événement contraire
statement: |
  Un événement $A$ a pour probabilité $P(A) = 0{,}35$.
  Quelle est la probabilité de son événement contraire $\overline{A}$ ?
choices:
  a: '$0{,}35$'
  b: '$0{,}65$'
  c: '$1{,}35$'
  d: '$0{,}5$'
hints:
  - 'A et son contraire se partagent toute la probabilité, qui vaut 1.'
solution: |
  $P(\overline{A}) = 1 - P(A) = 1 - 0{,}35 = 0{,}65$.

  Une probabilité ne peut jamais dépasser 1 : la réponse c est impossible.
