title: Une série qui commence à 1
statement: |
  Calcule $\displaystyle\sum_{k=1}^{\infty}\left(\frac{1}{3}\right)^{k}$ (résultat décimal).
hints:
  - 'La somme commence à $k = 1$ : le premier terme est $\dfrac{1}{3}$, et la raison est $\dfrac{1}{3}$.'
solution: |
  $\displaystyle\sum_{k=1}^{\infty}\left(\frac{1}{3}\right)^{k} = \frac{\frac{1}{3}}{1 - \frac{1}{3}} = \frac{\frac{1}{3}}{\frac{2}{3}} = \frac{1}{2} = 0{,}5$.
