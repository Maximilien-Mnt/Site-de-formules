title: Le minimum d'un trinôme
statement: |
  Quel est le minimum de la fonction $f(x) = x^{2} - 6x + 5$ ?
hints:
  - 'Calcule d''abord l''abscisse du sommet $\alpha = -\dfrac{b}{2a}$.'
  - 'Le minimum est $f(\alpha)$.'
solution: |
  $\alpha = -\dfrac{-6}{2 \times 1} = 3$.

  $f(3) = 9 - 18 + 5 = -4$.

  Comme $a = 1 > 0$, la parabole est tournée vers le haut : le minimum de $f$ vaut $-4$ (atteint en $x = 3$).
